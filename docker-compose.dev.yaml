services:
  postgres:
    image: postgres:18
    container_name: quiz-engine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quiz-engine
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev -d quiz-engine" ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: