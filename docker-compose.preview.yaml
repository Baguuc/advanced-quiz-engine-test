services:
  postgres:
    image: postgres:18
    container_name: quiz-engine-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: quiz-engine
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d quiz-engine"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - postgres

  app:
    container_name: quiz-engine
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_URL: ${APP_URL:?APP_URL is required}
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?APP_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      DATABASE_URL: postgresql://dev:dev@postgres:5432/quiz-engine
    ports:
      - "5173:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres

networks:
  postgres:
    name: postgres
    driver: bridge

volumes:
  postgres_data:
